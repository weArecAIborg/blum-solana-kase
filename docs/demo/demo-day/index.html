<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blum · Demo Day</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../blum/styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.3/plotly.min.js"></script>
<style>
/* Питч для Demo Day 27.10.2026 по a-human-review/iter2.md: 10 слайдов питча и 10 слайдов приложения с ответами на
   вопросы из зала. Числа: тест на devnet 23.10.2026 (docs/devnet-evidence-demo.md), тест с 1 000 держателей
   (docs/devnet-evidence-crowd-1000.md), атаки (docs/hostile-attempts.md), аудит (expertise/independent-ledger-audit.md),
   пределы и устройство (docs/technical-overview.md, programs/bond_servicing/src/state.rs).
   Слайды 2-9: один экран теста 23.10 (реестр, счёт выплаты, ledger), меняются подпись сверху и значения;
   на слайде 9 строки реестра раскрываются в расчёт ончейн аудита.
   Стрелки, пробел или клик листают; P открывает снимок explorer на слайде 7. */
html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
#stage { position: fixed; inset: 0; display: grid; place-items: center; }
.sc { text-shadow: 0 0 1px rgba(0, 0, 0, 0.9), 0 1px 1px rgba(0, 0, 0, 0.5); width: 1920px; height: 1080px; box-sizing: border-box; background: var(--bg); color: var(--ink); font: var(--body); padding: 60px 80px 64px; display: grid; grid-template-rows: auto auto auto 1fr; gap: 22px; position: absolute; transform-origin: center; }
.sc :is(h1, h2, p, ul) { margin: 0; }
.sc * { min-width: 0; }
:root { --blum: #4aaeff; --blum-soft: rgba(74, 174, 255, 0.18); --sol: #bb8cff; --sol-soft: rgba(153, 69, 255, 0.22); --cut: #ffb020; --cut-soft: rgba(255, 176, 32, 0.18); --ok: #9eea72; --ok-soft: rgba(110, 190, 70, 0.30); --out: #ff6a55; --out-soft: rgba(255, 106, 85, 0.22);
  /* контраст для проектора в светлом зале: светлее текст и рамки, ярче цвета */
  --ink: #ffffff; --ink-2: #e4e1d8; --muted: #b5b1a8; --border: #45454c; --grid: #34343a; --accent: #4aaeff; --amber: #ffb020; --kept: #9eea72; --kept-bg: rgba(110, 190, 70, 0.30); }
/* Цвета питча: синий = Blum (программа и её действия); фиолетовый = Solana (сеть, Token-2022, DvP, транзакции);
   янтарный = отсечка (время и права на момент отсечки); зелёный = подтверждённый результат (выплата получена,
   аудит пройден); красный = деньги ушли со счёта выплаты; серый и белый = участники и обычный текст. Надзаголовки
   слайдов янтарные, как на сайте. */
.ey { font: 600 26px/1 var(--font-mono); color: var(--amber); text-transform: uppercase; letter-spacing: 0.06em; }
.c-blum { color: var(--blum); } .c-ok { color: var(--ok); } .c-cut { color: var(--cut); }
.c-sol { background: linear-gradient(90deg, #9945FF, #14F195); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; }
/* Треугольник KASE: знак в цветах логотипа, три грани */
.ktri { display: inline-block; position: relative; width: 1.15em; height: 1em; vertical-align: -0.12em; margin: 0 0.4em; }
.ktri i { position: absolute; inset: 0; }
.ktri .a { background: #9ccc3c; clip-path: polygon(50% 0, 0 100%, 50% 76%); }
.ktri .b { background: #2e9b3a; clip-path: polygon(50% 0, 50% 76%, 100% 100%); }
.ktri .c { background: #5fb83a; clip-path: polygon(0 100%, 50% 76%, 100% 100%); }
.sc h1 { font: 800 74px/1.06 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.01em; text-wrap: balance; max-width: 1700px; }
.lead { font-size: 38px; line-height: 1.3; color: var(--ink-2); max-width: 1640px; }
.vis { min-height: 0; display: grid; align-content: center; }
.foot { position: absolute; left: 80px; bottom: 56px; font: 500 24px/1 var(--font-mono); color: var(--muted); display: flex; gap: 40px; }

/* Обложка */
/* Фон обложки: на обложке, разделителях, содержании и текстовых слайдах */
.sc.glow { background: radial-gradient(ellipse 900px 700px at 78% 52%, rgba(153, 69, 255, 0.16), transparent 70%), radial-gradient(ellipse 700px 520px at 92% 88%, rgba(20, 241, 149, 0.10), transparent 70%), var(--bg); }
.cover { grid-template-rows: auto 1fr auto; overflow: hidden;
  background: radial-gradient(ellipse 900px 700px at 78% 52%, rgba(153, 69, 255, 0.16), transparent 70%),
              radial-gradient(ellipse 700px 520px at 92% 88%, rgba(20, 241, 149, 0.10), transparent 70%), var(--bg); }
.cover > :not(.foot):not(.sol3d):not(.pg):not(.chp):not(.navbar) { position: relative; z-index: 1; }
.cover > .foot { z-index: 1; }
.cover .mid { display: grid; gap: 30px; align-content: center; max-width: 1060px; }
.cover .name { display: flex; align-items: center; font: 800 200px/1 var(--font-display); font-stretch: var(--display-stretch); letter-spacing: -0.02em; color: var(--ink); }
.cover .name .box { display: inline-flex; align-items: center; height: 1.1em; padding: 0 0.08em 0 0.07em; margin-right: 0.04em; background: var(--ink); color: var(--bg); }
.cover h1 { font-size: 72px; color: var(--ink); }
.cover .lead { color: var(--muted); }
.cover .lead b { color: var(--ink-2); font-weight: 600; }
.cover .th3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 40px; margin-top: 40px; }
.cover .th3 div { display: grid; gap: 12px; align-content: start; }
.cover .th3 b { font: 700 108px/1 var(--font-mono); color: var(--ink); }
.cover .th3 b.sol { color: var(--sol); }
.cover .th3 b.cut { color: var(--cut); } .cover .th3 b.ok { color: var(--ok); } .cover .th3 b.blum { color: var(--blum); }
.cover .mid.wide { max-width: 1640px; }
.cover .plist { display: grid; gap: 22px; margin: 18px 0 0; padding: 0; list-style: none; }
.cover .plist li { position: relative; padding-left: 44px; font: 600 40px/1.2 var(--font-display); font-stretch: var(--display-stretch); color: var(--ink); }
.cover .plist li::before { content: ""; position: absolute; left: 0; top: 0.42em; width: 18px; height: 18px; background: var(--amber); }
.cover.dv .th3 { column-gap: 72px; }
.cover.dv .th3 span { font-size: 32px; }
.cover .th3.four { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 64px; }
.cover .th3.four a { display: grid; gap: 16px; align-content: start; text-decoration: none; cursor: pointer; }
.cover .th3.four a b { font: 700 108px/1 var(--font-mono); color: var(--amber); }
.cover .th3.four a span { font: 600 38px/1.2 var(--font-display); font-stretch: var(--display-stretch); color: var(--ink); }
.cover .th3.four a:hover span { color: var(--blum); }
.cover .th3 span { font: 400 28px/1.25 var(--font-body); color: var(--ink-2); }
.cover .ey { color: var(--ink-2); }

/* Знак Solana на обложке: форма Simple Icons «solana» (CC0, simple-icons@13.0.0), цвета Solana #9945FF и #14F195.
   Объём: 18 слоёв со сдвигом по глубине, группа повёрнута в 3D. */
.cover > .sol3d { position: absolute; z-index: 0; right: 40px; top: 170px; width: 780px; height: 700px; perspective: 1700px; pointer-events: none; opacity: 0.5; }
.sol3d .g { position: absolute; inset: 0; transform-style: preserve-3d; transform: rotateY(-34deg) rotateX(16deg) rotateZ(-6deg); animation: solfloat 14s ease-in-out infinite; }
.sol3d .g i { position: absolute; inset: 0; -webkit-mask: url(assets/solana-mark.svg) center / contain no-repeat; mask: url(assets/solana-mark.svg) center / contain no-repeat; background: linear-gradient(120deg, #9945FF 0%, #8752F3 30%, #5497D5 60%, #43B4CA 75%, #14F195 100%); }
.sol3d .g i.top { filter: drop-shadow(0 0 40px rgba(153, 69, 255, 0.55)); }
@keyframes solfloat { 0%, 100% { transform: rotateY(-34deg) rotateX(16deg) rotateZ(-6deg) translateY(0); } 50% { transform: rotateY(-26deg) rotateX(12deg) rotateZ(-4deg) translateY(-14px); } }
@media (prefers-reduced-motion: reduce) { .sol3d .g { animation: none; } }

/* Ползунок времени */
.tl { position: relative; margin-bottom: 22px; }
.tl .track, .tl .fill { position: absolute; left: 0; top: 9px; height: 3px; }
.tl .track { right: 0; background: var(--grid); }
.tl .fill { background: var(--amber); transition: width 0.6s; }
.tl .pts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative; }
.tl .p { display: grid; justify-items: start; gap: 10px; font: 600 26px/1 var(--font-mono); color: var(--muted); }
.tl .p i { width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 3px solid var(--grid); box-sizing: border-box; }
.tl .p.past { color: var(--ink-2); }
.tl .p.past i, .tl .p.now i { border-color: var(--amber); background: var(--amber); }
.tl .p.now { color: var(--amber); }
.tl .p.now i { box-shadow: 0 0 0 7px var(--amber-soft); }

/* Воронка и окно программы */
.two { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 48px; align-items: start; }
.left { display: grid; gap: 22px; }
.board { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.col { display: grid; grid-template-rows: auto 1fr; gap: 14px; }
.col > .h { padding-bottom: 10px; border-bottom: 3px solid var(--grid); font: 600 26px/1.1 var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.col.on > .h { color: var(--cut); border-bottom-color: var(--cut); }
.col.pay.on > .h { color: var(--ok); border-bottom-color: var(--ok); }
.col > .cards { display: grid; align-content: start; gap: 12px; }
.card { display: grid; gap: 2px; padding: 12px 20px; border: 2px solid var(--border); background: var(--surface); }
.card .t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 600 30px/1.1 var(--font-mono); }
.card .t small { font: 500 24px/1 var(--font-mono); color: var(--muted); }
.card .v { font: 600 52px/1.05 var(--font-mono); font-variant-numeric: tabular-nums; }
.card .l { font: 400 26px/1.2 var(--font-body); color: var(--muted); }
.card.now { border-color: var(--accent); box-shadow: 0 14px 30px rgba(0, 0, 0, 0.7); }
.card.ok { border-color: var(--kept); background: var(--kept-bg); }
.card.none { border-style: dashed; }
.card.none .v { color: var(--muted); }
.bal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 20px; }
.sc .bal > p { grid-column: 1 / -1; font: 600 26px/1 var(--font-body); color: var(--muted); }
.bal > div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 20px; border: 2px solid var(--border); }
.bal b { font: 600 30px/1.1 var(--font-mono); }
.bal .q { font: 600 46px/1 var(--font-mono); color: var(--ink); }
.bal .q i { font-style: normal; color: var(--muted); }
.bal .q em { font-style: normal; color: var(--amber); }
.prog { border: 2px solid var(--border); background: var(--surface); }
.prog .bar { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--bar); font: 600 26px/1 var(--font-mono); color: var(--bar-ink); }
.prog .bar i { width: 14px; height: 14px; border-radius: 50%; background: var(--grid); }
.prog .bar span { margin-left: 8px; }
.prog .in { display: grid; gap: 18px; padding: 22px 20px 24px; }
.prog .lab { font: 600 26px/1 var(--font-body); color: var(--muted); }
.tree { display: grid; gap: 10px; list-style: none; padding: 0; margin: 0; }
.node { margin-left: calc(var(--d) * 34px); border: 1px solid var(--border); border-left: 5px solid var(--muted); padding: 10px 16px; background: var(--bg); position: relative; font: 600 28px/1.25 var(--font-mono); }
.node.ours { border-left-color: var(--blum); }
.node.sol { border-left-color: var(--sol); }
.node.sol b { color: var(--sol); }
.node.ours b { color: var(--blum); }
.node span { font: 400 28px/1.25 var(--font-body); color: var(--ink-2); }
.node[style*="--d:1"]::before { content: "\21b3"; position: absolute; left: -30px; top: 10px; color: var(--muted); }
.rows { display: grid; gap: 10px; }
.row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 10px 16px; border: 1px solid var(--grid); font: 500 28px/1.2 var(--font-mono); color: var(--ink-2); }
.row b { font: 600 36px/1 var(--font-mono); color: var(--ink); }
.row.hot { border-color: var(--amber); background: var(--amber-soft); }
.row.hot b { color: var(--cut); }
.row.ok { border-color: var(--ok); background: var(--ok-soft); }
.row.ok b { color: var(--ok); }

/* Как работает программа: запись продавца в четырёх моментах */
.rec4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
.rec4 > div { display: grid; grid-template-rows: auto auto 1fr; gap: 14px; padding: 22px 22px 24px; border: 2px solid var(--border); background: var(--surface); border-top: 6px solid var(--grid); }
.rec4 > div.on { border-top-color: var(--blum); }
.rec4 .w { font: 700 34px/1.1 var(--font-display); font-stretch: var(--display-stretch); }
.rec4 .f { display: grid; gap: 8px; }
.rec4 .f span { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 8px 14px; border: 1px solid var(--grid); font: 500 26px/1.2 var(--font-body); color: var(--ink-2); }
.rec4 .f span b { font: 600 36px/1 var(--font-mono); color: var(--ink); }
.rec4 .f span.hot { border-color: var(--amber); background: var(--amber-soft); }
.rec4 .f span.hot b { color: var(--cut); }
.rec4 .f span.ok { border-color: var(--ok); background: var(--ok-soft); }
.rec4 .f span.ok b { color: var(--ok); }
.rec4 .f span.off b { color: var(--muted); }
.rec4 p { font: 400 28px/1.3 var(--font-body); color: var(--ink-2); align-self: end; }
.rec4-cap { margin-bottom: 18px; font: 600 28px/1 var(--font-body); color: var(--muted); }

/* Корпоративные действия: четыре шага из условий трека и три действия */
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin-bottom: 30px; }
.steps div { padding: 18px 22px; border: 2px solid var(--blum); border-left-width: 0; font: 700 34px/1.1 var(--font-display); font-stretch: var(--display-stretch); color: var(--blum); }
.steps div:first-child { border-left-width: 2px; }
.acts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
.act { display: grid; gap: 14px; align-content: start; padding: 24px 0 0; border-top: 4px solid var(--accent); }
.act b { font: 700 40px/1.1 var(--font-display); font-stretch: var(--display-stretch); }
.act span { font: 400 30px/1.3 var(--font-body); color: var(--ink-2); }

/* Блоки со стрелками */
.flow { display: flex; align-items: center; gap: 0; }
.flow .bx { flex: 1 1 0; display: grid; gap: 10px; padding: 24px 26px; border: 2px solid var(--border); background: var(--surface); }
.flow .bx b { font: 700 38px/1.1 var(--font-display); font-stretch: var(--display-stretch); }
.flow .bx span { font: 400 28px/1.3 var(--font-body); color: var(--ink-2); }
.flow .bx.blum { border: 3px solid var(--accent); }
.flow .bx.blum b { color: var(--accent); }
.flow .bx.ok { border-color: var(--ok); background: var(--ok-soft); }
.flow .bx.ok b { color: var(--ok); }
.flow .bx.sol { border-color: var(--sol); background: var(--sol-soft); }
.flow .bx.sol b { color: var(--sol); }
.flow .bx.aud { border: 3px solid var(--ok); }
.flow .bx.aud b { color: var(--ok); }
.flow .bx.now { border: 3px solid var(--kept); background: var(--kept-bg); }
.flow .ar { flex: none; width: 70px; height: 3px; background: var(--muted); position: relative; }
.flow .ar::after { content: ""; position: absolute; right: -2px; top: -8px; border-left: 12px solid var(--muted); border-block: 9px solid transparent; }
.flow.tight .ar { width: 44px; }
.flow.tight .bx { padding: 20px 20px; }
.flow.tight .bx b { font-size: 34px; }
.flow.tight .bx span { font-size: 26px; }
.stack { display: grid; gap: 18px; flex: 1 1 0; }
.sc .note { margin-top: 26px; font: 400 30px/1.3 var(--font-body); color: var(--muted); }

/* Плитки с числами */
.tiles { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.tile { display: grid; grid-template-columns: 720px 1fr; gap: 32px; align-items: center; padding: 22px 30px; border: 2px solid var(--kept); background: var(--kept-bg); }
.tile em { font: 700 72px/1 var(--font-mono); font-style: normal; color: var(--ink); white-space: nowrap; }
.tile span { font: 400 32px/1.3 var(--font-body); color: var(--ink-2); }

/* Место в инфраструктуре оЦФА: Solana и Blum в центре, участники вокруг */
.hub { display: grid; grid-template-columns: 360px 120px minmax(0, 1fr) 120px 360px; grid-template-rows: auto 64px auto 64px auto; align-items: center; }
.hub .bx { display: grid; gap: 8px; padding: 18px 22px; border: 2px solid var(--border); background: var(--surface); }
.hub .bx b { font: 700 36px/1.1 var(--font-display); font-stretch: var(--display-stretch); }
.hub .bx span { font: 400 27px/1.3 var(--font-body); color: var(--ink-2); }
.hub .kase { grid-column: 3; grid-row: 1; }
.hub .kase b { color: var(--ink); }
.hub .iss { grid-column: 1; grid-row: 3; }
.hub .inv { grid-column: 5; grid-row: 3; }
.hub .csd { grid-column: 3; grid-row: 5; border-style: dashed; }
.hub .sol { grid-column: 3; grid-row: 3; display: grid; gap: 14px; padding: 20px 22px 22px; border: 3px solid var(--sol); background: rgba(153, 69, 255, 0.07); }
.hub .sol > b { font: 700 36px/1.1 var(--font-display); font-stretch: var(--display-stretch); color: var(--sol); }
.hub .sol .in { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.hub .sol .in div { padding: 12px 16px; border: 1px solid var(--border); font: 500 26px/1.25 var(--font-body); color: var(--ink-2); }
.hub .sol .in div.blum { border: 3px solid var(--blum); color: var(--ink); }
.hub .sol .in div.aud { border: 3px solid var(--ok); color: var(--ink); }
.hub .sol .in div.aud b { color: var(--ok); font: 700 32px/1.1 var(--font-display); font-stretch: var(--display-stretch); display: block; }
.hub .sol .in div.blum b { color: var(--blum); font: 700 32px/1.1 var(--font-display); font-stretch: var(--display-stretch); display: block; }
.hub .h, .hub .v { position: relative; display: grid; place-items: center; }
.hub .h { height: 100%; }
.hub .h::before { content: ""; position: absolute; left: 6px; right: 6px; top: 50%; height: 3px; background: var(--muted); }
.hub .h::after { content: ""; position: absolute; right: 2px; top: calc(50% - 8px); border-left: 12px solid var(--muted); border-block: 9px solid transparent; }
.hub .v::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 50%; width: 3px; background: var(--muted); }
.hub .v::after { content: ""; position: absolute; bottom: 0; left: calc(50% - 8px); border-top: 12px solid var(--muted); border-inline: 9px solid transparent; }
.hub .v.dash::before { background: none; border-left: 3px dashed var(--muted); width: 0; }
.hub .v.dash::after { display: none; }
.hub .lbl { position: relative; z-index: 1; padding: 2px 10px; background: var(--bg); font: 500 24px/1.1 var(--font-body); color: var(--muted); }
.hub .h .lbl { transform: translateY(-30px); background: none; }
.hub .a1 { grid-column: 2; grid-row: 3; }
.hub .a2 { grid-column: 4; grid-row: 3; }
.hub .a3 { grid-column: 3; grid-row: 2; }
.hub .a4 { grid-column: 3; grid-row: 4; }

/* Последний слайд: таймлайн и три колонки */
.rm { position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 40px; margin-bottom: 84px; }
.rm::before { content: ""; position: absolute; left: 0; right: 0; top: 13px; height: 4px; background: var(--grid); }
.rm::after { content: ""; position: absolute; left: 0; top: 13px; width: calc(20% - 32px); height: 4px; background: linear-gradient(90deg, var(--ok), rgba(158, 234, 114, 0)); }
.rm > div { position: relative; display: grid; align-content: start; gap: 14px; padding-top: 58px; }
.rm > div::before { content: ""; position: absolute; left: 0; top: 0; width: 30px; height: 30px; box-sizing: border-box; border-radius: 50%; border: 4px solid var(--border); background: var(--bg); }
.rm > div.now::before { border-color: var(--ok); background: var(--ok); box-shadow: 0 0 0 10px var(--ok-soft); }
.rm small { font: 600 24px/1 var(--font-mono); color: var(--muted); letter-spacing: 0.06em; }
.rm > div.now small { color: var(--ok); }
.rm b { font: 700 40px/1.1 var(--font-display); font-stretch: var(--display-stretch); }
.rm > div.now b { color: var(--ok); }
.rm span { font: 400 28px/1.3 var(--font-body); color: var(--ink-2); }

<script>
const NB = ' ';

// Оценка для 100 000 держателей. По очереди: время теста растёт линейно с числом держателей. Параллельно: каждая
// выплата пишет в счёт купона; около 24 000 compute units на держателя (замер) и предел Solana 12 млн units на один
// записываемый счёт за блок (docs/technical-overview.md, Throughput); блок 0,4 с.
const EST = (() => {
  const n = 100000, cuPerHolder = 24000, cuPerAccountPerBlock = 12e6, blockSec = 0.4, c1 = PAYSPEED[0];
  const perBlock = cuPerAccountPerBlock / cuPerHolder, blocks = Math.ceil(n / perBlock);
  return { n, hours: Math.round(c1.seconds * n / c1.holders / 3600), perBlock, blocks, seconds: Math.round(blocks * blockSec) };
})();
// График скорости выплат: сколько держателей получили купон за секунды с первой транзакции выплаты (Plotly).
function drawPaySpeed(id) {

  if (typeof Plotly === 'undefined') { el.textContent = 'plotly.js не загрузился: нет связи с cdnjs.cloudflare.com'; return; }
  const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  const line = (p, color, width) => ({ x: p.points.map(q => q[0]), y: p.points.map(q => q[1]), mode: 'lines', line: { color, width, shape: 'hv' }, hoverinfo: 'skip' });
  const c1 = PAYSPEED[0], rest = PAYSPEED.slice(1);
  const axis = title => ({ title: { text: title, font: { size: 20, color: css('--ink-2') } }, gridcolor: css('--grid'), linecolor: css('--border'), zeroline: false, tickfont: { size: 18, color: css('--muted') } });

    paper_bgcolor: css('--surface'), plot_bgcolor: css('--surface'), font: { family: css('--font-mono') }, showlegend: false,
    margin: { l: 96, r: 28, t: 24, b: 78 },
    xaxis: Object.assign(axis('секунды с первой выплаты'), { range: [0, Math.max(...PAYSPEED.map(p => p.seconds)) + 10] }),

// График tender: заявлено держателями и выкуплено, линия максимума предложения (Plotly).

// Состояние экрана после каждой строки ledger. Позиции считаются как в программе (PositionHistory): позиция на
// отсечку e записана, если e < live_from, иначе равна текущему количеству (остаток плюс облигации в escrow).
const RUNST = (() => {
  const own = Array(NBONDS).fill(-2), esc = Array(NBONDS).fill(false), burn = Array(NBONDS).fill(false);
  const live = [0, 0, 0], at = [[], [], []], stored = [];
  let cuts = 0, focus = -1, kind = '', ev = -1, owed = null, paidEv = false, budget = 0, vault = 0, paid = 0, got = [0, 0, 0];
  const pos = h => own.reduce((n, o, b) => n + (o === h && !burn[b] ? 1 : 0), 0);
  const save = h => { let fresh = false; for (let e = live[h]; e < cuts; e++) { at[h][e] = pos(h); (stored[e] = stored[e] || new Set()).add(h); fresh = true; } live[h] = cuts; return fresh; };
  const atCut = (h, e) => e < live[h] ? at[h][e] : pos(h);
  const ids = (h, pred) => own.map((o, b) => b).filter(b => own[b] === h && !burn[b] && pred(b));
  return LEDGER.map(([d, x, sig, op], r) => {
    const fx = { saved: [], cut: false, open: false, fund: false, pay: null, out: 0, keep: false };
    if (op.audit) { const last = LEDGER.slice(0, r).map((l, j) => j).reverse().find(j => LEDGER[j][3].pay !== undefined || LEDGER[j][3].redeem !== undefined);
      if (last !== r - 1) throw new Error('строка аудита должна идти сразу за последней выплатой'); }
    if (op.place) { let b = 0; op.place.forEach((q, h) => { for (let k = 0; k < q; k++) own[b++] = h; }); }
    if (op.cut !== undefined) { cuts = op.cut + 1; focus = op.cut; owed = null; paidEv = false; fx.cut = true; }
    if (op.esc) { const [h, n] = op.esc; if (save(h)) fx.saved.push(h); ids(h, b => !esc[b]).slice(-n).forEach(b => { esc[b] = true; }); }
    if (op.settle) {
      const [f, t, n] = op.settle; [f, t].forEach(h => { if (save(h)) fx.saved.push(h); });
      const m = ids(f, b => esc[b]); if (m.length !== n) throw new Error(`строка ${r}: в escrow ${m.length}, по сделке ${n}`);
      m.forEach(b => { own[b] = t; esc[b] = false; });

    if (op.xfer) { const [f, t, n] = op.xfer; [f, t].forEach(h => { if (save(h)) fx.saved.push(h); }); ids(f, b => !esc[b]).slice(-n).forEach(b => { own[b] = t; }); }

      ev = op.open; kind = ev < 4 ? 'c' : 'r'; focus = kind === 'c' ? ev : 3;
      owed = [0, 1, 2].map(h => atCut(h, focus) * (kind === 'c' ? CPN : FACE)); budget = owed.reduce((s, v) => s + v, 0);
      paidEv = false; vault = 0; fx.open = true;
    }
    if (op.fund !== undefined) { vault = budget; fx.fund = true; }
    if (op.pay !== undefined || op.redeem !== undefined) {
      if (op.redeem !== undefined) [0, 1, 2].forEach(h => { if (save(h)) fx.saved.push(h); });
      const want = op.redeem !== undefined ? MEASURED.redeem : MEASURED.pay[op.pay];
      if (!sameList(owed, want)) throw new Error(`строка ${r}: экран ${owed}, тест ${want}`);
      got = got.map((g, h) => g + owed[h]); paid += budget; vault = 0; paidEv = true; fx.pay = owed.slice(); fx.out = budget;
      if (op.redeem !== undefined) own.forEach((o, b) => { if (o >= 0) burn[b] = true; });
    }
    return { own: own.slice(), esc: esc.slice(), burn: burn.slice(), pos: [0, 1, 2].map(pos), focus, kind, ev, budget, vault, paid, paidEv,
      cutv: focus < 0 ? null : [0, 1, 2].map(h => atCut(h, focus)), tags: [0, 1, 2].map(h => focus >= 0 && !!stored[focus] && stored[focus].has(h)),
      owed: owed && owed.slice(), got: got.slice(), supply: own.filter((o, b) => o >= 0 && !burn[b]).length, fx };
  }).map((st, r, all) => LEDGER[r][3].audit ? { ...st, fx: { ...all[r - 1].fx, saved: [], keep: true } } : st);
})();

// Панель ончейн аудита для держателя: сколько ему причитается по условиям выпуска и сделкам и сколько он получил в
// транзакциях Solana. Облигаций на отсечку: расчёт аудита по сделкам, у каждого изменения ссылка на транзакцию с облигациями.
function auditPanel(hi) {
  const h = RUNH[hi][1], who = RUNH[hi][2], A = AUDIT.holders[h], cpn = AUDIT.face * AUDIT.rateBps / 10000 / AUDIT.perYear;
  const tx = sig => `<a class="c" href="https://explorer.solana.com/tx/${sig}?cluster=devnet" target="_blank" rel="noopener" onclick="event.stopPropagation()">${sig.slice(0, 4)}…</a>`;
  const day = d => { const [dd, mm, yy] = d.split('.'); return +(yy + mm + dd); };
  const cuts = AUDIT.recordDates.map(day);
  A.moves.forEach(m => { if (cuts.includes(day(m.day))) throw new Error(`${h}: облигации двигались в день отсечки ${m.day}`); });
  let prev = 0;
  const rows = A.events.map(e => {
    if (e.kind === 'coupon' && e.perBond !== null && e.perBond !== cpn) throw new Error(`${h}: купон на облигацию ${e.perBond}, по условиям ${cpn}`);
    let at = `${e.pos}`, chips = '';
    if (e.kind === 'coupon') {
      const from = e.k ? cuts[e.k - 1] : 0, to = cuts[e.k];
      const ms = A.moves.filter(m => day(m.day) > from && day(m.day) < to);
      const sum = ms.reduce((t, m) => t + m.q, 0);
      if (prev + sum !== e.pos) throw new Error(`${h}: на отсечку ${e.k + 1} по сделкам ${e.pos}, по Solana ${prev + sum}`);
      if (e.k && sum) at = `${prev} ${sum > 0 ? '+' : '−'} ${Math.abs(sum)} = ${e.pos}`;
      chips = ms.map(m => tx(m.sig)).join(' ');
      prev = e.pos;
    }
    const name = e.kind === 'coupon' ? `Купон ${e.k + 1} · ${AUDIT.recordDates[e.k]}` : `Погашение${e.burned ? `, сожжены ${e.burned}` : ''}`;
    const per = e.kind === 'coupon' ? cpn : AUDIT.face;
    return `<tr><td>${name}</td><td>${at}</td><td class="mvs">${chips}</td><td class="f">${e.pos} × ${fmt(per)} = ${fmt(e.expected)}</td><td class="m">${fmt(e.measured || 0)}</td><td>${e.sig ? tx(e.sig) : '·'}</td></tr>`;
  }).join('');
  const same = A.expected === A.measured, passed = A.checks.filter(c => c.ok).length;
  return `<div class="ap">
    <table><tr><th>Событие</th><th>Облигаций<br>на отсечку</th><th>Транзакции<br>с облигациями</th><th>Причитается ${who}<br>по условиям</th><th>Получил ${RUNH[hi][3]}<br>в Solana</th><th>Транзакция<br>выплаты</th></tr>${rows}
      <tr class="tot"><td>Итого</td><td></td><td></td><td>${fmt(A.expected)}</td><td class="m">${fmt(A.measured)}</td><td class="${same ? 'ok' : 'bad'}">${same ? 'совпало' : 'расхождение'}</td></tr></table>
    <p class="fx">Купон на облигацию: ${fmt(AUDIT.face)} × ${AUDIT.rateBps / 100}${NB}% / ${AUDIT.perYear} = ${cpn} · <b class="${passed === A.checks.length ? 'ok' : 'bad'}">${passed} из ${A.checks.length}</b> проверок аудита по ${who} ${h} пройдены</p>
  </div>`;
}
// Остановка на строке аудита: у строк реестра кнопка «развернуть». Раскрытая строка стоит на своём месте и выглядит
// как на прошлом слайде, остальные строки убраны, вместо них расчёт аудита. open = раскрытая строка (-1: ни одной).
function rvAudit(on, open) {
  const rv = document.getElementById('rv'), reg = sc.querySelector('.rv-reg'), box = reg.querySelector('.apw');

  const y = Math.max(0, Math.min(LEDGER.length * H - lw.clientHeight, r * H - (lw.clientHeight - H) / 2));
  ol.style.transition = anim ? '' : 'none'; ol.style.transform = `translateY(${-y}px)`;
  // обводка ячеек, о которых говорит подпись слайда (на остановке)
  sc.querySelectorAll('.rv-reg .mk').forEach(e => e.classList.remove('mk'));
  const marked = mode === 'step' ? [] : (RV.marks || []).map(m => +m.split('.')[0]);
  RV.rows.forEach((row, h) => row.classList.toggle('dim', marked.length > 0 && !marked.includes(h)));
  if (mode !== 'step') (RV.marks || []).forEach(m => {
    const [h, c] = m.split('.'), el = RV.rows[+h].querySelector(c === 'bonds' ? '.bonds' : '.cell.' + c);
    if (!el) throw new Error('mark ' + m); el.classList.add('mk');
  });
  // ползунок времени
  const pct = LEDGER[r][4] / LASTDAY * 100;
  q('rv-fill').style.width = pct + '%'; q('rv-knob').style.left = pct + '%';
  sc.querySelectorAll('.rv-track .tk').forEach(t => t.classList.toggle('past', +t.dataset.d <= LEDGER[r][4]));
}
// Переход к строке: вперёд по одной строке (менее важные проходят быстро), назад сразу.
function rvGo(target, forward, delay) {
  const g = ++rvGen, from = RV.at;
  if (!forward || from < 0 || from >= target) { rvSet(target, 'set'); RV.at = target; return; }
  const n = target - from, dt = Math.max(110, Math.min(480, 1700 / n));
  for (let j = 1; j <= n; j++) setTimeout(() => {
    if (g !== rvGen) return;
    rvSet(from + j, from + j === target ? 'stop' : 'step'); RV.at = from + j;
  }, (delay || 0) + (j - 1) * dt + (j === n && n > 1 ? 200 : 0));
}

// Разделитель главы и содержание: оформление обложки, крупно и без линий.
function divider(n) {
  const c = CHAPTERS.find(x => x.n === n);
  return `<p class="ey">Глава ${n} из ${CHAPTERS.length}</p>
    <div class="mid wide"><div class="name" aria-label="Глава ${n}"><span class="box">0${n}</span></div><h1>${c.name}</h1>
    ${c.theses ? `<ul class="plist">${c.theses.map(t => `<li>${t}</li>`).join('')}</ul>`
      : `<div class="th3">${c.points.map(([b, t, cls]) => `<div><b class="${cls || ''}">${b}</b><span>${t}</span></div>`).join('')}</div>`}</div>`;
}
function tocSlide() {
  return `<p class="ey">Superteam Kazakhstan${KTRI}KASE · Demo Day · 27.10.2026</p>
    <div class="mid wide">
    <div class="th3 four">${CHAPTERS.map(c => `<a onclick="event.stopPropagation();show(${chRange(c.n)[0] - 1})"><b>0${c.n}</b><span>${c.name}</span></a>`).join('')}</div></div>`;
}
function cover() {
  const layers = Array.from({ length: 18 }, (_, k) => k === 0
    ? '<i class="top" style="transform:translateZ(0)"></i>'
    : `<i style="transform:translateZ(${-k * 4}px);filter:brightness(${(0.55 - k * 0.022).toFixed(3)});opacity:${(0.9 - k * 0.03).toFixed(2)}"></i>`).reverse().join('');
  return `<div class="sol3d" aria-hidden="true"><div class="g">${layers}</div></div>
    <p class="ey">Superteam Kazakhstan${KTRI}KASE · Demo Day · 27.10.2026</p>
    <div class="mid"><div class="name" aria-label="Blum"><span class="box">Bl</span>um</div><h1>Решение для операторов ЦФА на <span class="c-sol">Solana</span></h1>
    <div class="th3"><div><b>24/7</b><span>торги продолжаются в момент отсечки</span></div><div><b>T+0</b><span>поставка в целевой схеме</span></div><div><b class="sol">DvP</b><span>расчёты через Solana</span></div></div></div>
    <p class="foot"><span>blum.caiborg.ai</span><span>github.com/weArecAIborg/blum-solana-kase</span></p>`;
}

// Полоса навигации: начало, разделители глав, оглавление приложения.
const NAVBAR = [['Начало', 0], ...CHAPTERS.map(c => [`<b>0${c.n}</b>${c.name}`, chRange(c.n)[0] - 1]), ['Ответы на вопросы', S.findIndex(s => s.idx)]]
  .map(([t, n]) => `<a onclick="event.stopPropagation();show(${n})">${t}</a>`).join('');

// ---------- показ ----------
let i = 0, cur = -1, popOn = false, timers = [];
const sc = document.getElementById('sc'), nav = document.getElementById('nav');
const scale = () => Math.min(innerWidth / 1920, innerHeight / 1080);
// Новая мысль с новой строки: каждое предложение подзаголовка начинается с новой строки.
const lines = p => p.replace(/([.!?])\s+(?=[А-ЯЁA-Z])/g, '$1<br>');
const capHtml = s => `<p class="ey">${s.ey}</p><h1>${s.h}</h1><p class="lead">${lines(s.p)}</p>`;
function render(n) {
  const s = S[n], prev = S[cur];
  if (s.run !== undefined && prev && prev.run !== undefined && RV) {
    // Тот же экран: меняется подпись сверху, внизу меняются значения.
    const cap = sc.querySelector('.cap'); cap.innerHTML = capHtml(s); flash(cap, 'in');
    const old = document.getElementById('pop'); if (old) old.remove();
    if (s.popup) sc.insertAdjacentHTML('beforeend', POP);
    RV.marks = s.mark; rvGo(s.run, n > cur); rvAudit(s.audit, s.open);
  } else {
    rvGen++; RV = null;
    const before = {};
    sc.querySelectorAll('[data-k]').forEach(e => { before[e.dataset.k] = e.getBoundingClientRect(); });
    sc.className = 'sc' + (s.cover || s.div || s.toc ? ' cover' : '') + (s.div ? ' dv' : '') + (s.toc ? ' tocs' : '') + (s.run === undefined ? ' glow' : '') + (s.appx ? ' appx' : '') + (s.idx ? ' idx' : '') + (s.chart ? ' has-chart' : '') + (s.run !== undefined ? ' run' : '');
    if (s.run !== undefined) {
      sc.innerHTML = `<div class="cap in">${capHtml(s)}</div>${runScreen()}${s.popup ? POP : ''}`;
      rvInit(); RV.marks = s.mark;
      // Вход на экран вперёд: экран въезжает снизу и проходит строки ledger до нужной; иначе сразу нужная строка.
      let back = -1; for (let j = n - 1; j > 0 && back < 0; j--) if (S[j].run !== undefined) back = S[j].run;
      if (cur >= 0 && n > cur && back >= 0) { rvSet(back, 'set'); RV.at = back; rvGo(s.run, true, 300); }
      else if (cur >= 0 && n > cur) { rvSet(0, 'set'); RV.at = 0; document.getElementById('rv').classList.add('intro'); rvGo(s.run, true, 700); }
      else { rvSet(s.run, 'set'); RV.at = s.run; }
      rvAudit(s.audit, s.open);
    } else {
      sc.innerHTML = s.cover ? cover() : s.div ? divider(s.div) : s.toc ? tocSlide() : `<p class="ey">${s.ey}</p><h1>${s.h}</h1><p class="lead">${lines(s.p)}</p><div class="vis">${s.vis()}</div>
    ${s.foot ? '<p class="foot"><span>blum.caiborg.ai</span><span>github.com/weArecAIborg/blum-solana-kase</span></p>' : ''}${s.popup ? POP : ''}`;
      const k = scale();
      sc.querySelectorAll('[data-k]').forEach(e => {
        const b = before[e.dataset.k], a = e.getBoundingClientRect();
        if (!b) return;
        const dx = (b.left - a.left) / k, dy = (b.top - a.top) / k;
        if (Math.abs(dx) + Math.abs(dy) > 1) e.animate([{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }], { duration: 800, easing: 'cubic-bezier(.2,.7,.2,1)' });
      });
      if (s.chart) s.chart();
    }
  }
  cur = n;
  nav.textContent = `${n + 1} / ${S.length}`;
  let pg = sc.querySelector('.pg');
  if (!pg) { pg = document.createElement('p'); pg.className = 'pg'; sc.appendChild(pg); }
  pg.textContent = `${n + 1} / ${S.length}`;
  let chp = sc.querySelector('.chp');
  if (!chp) { chp = document.createElement('p'); chp.className = 'chp'; sc.appendChild(chp); }
  const c = CHAPTERS.find(x => x.n === s.ch);
  chp.textContent = c && !s.div ? `Глава ${c.n} · ${c.name}` : '';
  if (!sc.querySelector('.navbar')) sc.insertAdjacentHTML('beforeend', `<nav class="navbar">${NAVBAR}</nav>`);
  history.replaceState(null, '', '#s' + (n + 1));
}
function togglePop(on) { const p = document.getElementById('pop'); if (!p) return; popOn = on === undefined ? !popOn : on; p.classList.toggle('on', popOn); }
function show(n) {
  timers.forEach(clearTimeout); timers = [];
  i = Math.max(0, Math.min(S.length - 1, n)); popOn = false; render(i);
  if (S[i].popup) timers.push(setTimeout(() => togglePop(true), 2600), setTimeout(() => togglePop(false), 8600));
}
function fit() { sc.style.transform = `scale(${scale()})`; }
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') show(i + 1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1);
  if (e.key === 'p' || e.key === 'P') togglePop();
  if (e.key === 'Escape') togglePop(false);
});
addEventListener('click', () => show(i + 1));
addEventListener('resize', fit); fit();
const h = parseInt((location.hash || '#s1').slice(2)); show(isNaN(h) ? 0 : h - 1);
</script>
</body>
