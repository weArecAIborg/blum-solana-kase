# Operator screen (docs/demo/operator-screen.html) and its service (ops/deploy/blum-operator.service). Included once in
# blum.caiborg.ai's server block: include /opt/solana-comp-KASE/ops/deploy/nginx-operator.conf;
location = /operator-screen { try_files /operator-screen.html =404; }
location /api/ {
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    client_max_body_size 64k;
}
